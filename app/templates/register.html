{% extends "base.html" %}

{% block title %}Registro - Administrador de Notas{% endblock %}

{% block extra_css %}
<style>
    /* Added background image to register page */
    .register-background {
        background-image: url('/static/davivienda.png');
        background-size: 40%;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        position: relative;
        min-height: calc(100vh - 150px);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .register-content {
        position: relative;
        z-index: 2;
    }

    /* Removed the dark overlay (::before pseudo-element) */
    /* Made card transparent with glassmorphism effect */
    .register-background .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
</style>
{% endblock %}

{% block content %}
<div class="register-background">
    <div class="register-content col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: var(--primary-color); font-weight: 700; font-size: 1.8rem;">
                    Crear Cuenta</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Mínimo 3 caracteres" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">Registrarse</button>
                </form>

                <p class="text-center text-muted mb-0">
                    Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
